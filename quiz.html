<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz om Datasikkerhet</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:black;
    color:white;
    line-height:1.6;
}

/* HEADER */

header{
    background:#0b0b0b;
    padding:25px;
    border-bottom:4px solid #22c55e;
    text-align:center;
}

header h1{
    color:#22c55e;
    font-size:40px;
    margin-bottom:15px;
}

/* NAVIGATION */

nav{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
    padding:10px 15px;
    border:2px solid transparent;
    transition:0.3s;
}

nav a:hover{
    border:2px solid #22c55e;
    border-radius:8px;
    color:#22c55e;
}

/* MAIN LAYOUT */

.main-container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

/* QUIZ BOX */

.quiz-box{
    background:#111111;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(34,197,94,0.3);
}

.quiz-box h2{
    color:#22c55e;
    margin-bottom:20px;
}

.question{
    margin-bottom:25px;
}

.question p{
    margin-bottom:10px;
    font-size:18px;
}

label{
    display:block;
    margin-bottom:10px;
    cursor:pointer;
}

/* BUTTON */

button{
    margin-top:20px;
    padding:12px 20px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:white;
    color:black;
}

/* RESULT */

#result{
    margin-top:20px;
    font-size:22px;
    color:#22c55e;
}

/* FOOTER */

footer{
    margin-top:50px;
    background:#0b0b0b;
    padding:25px;
    text-align:center;
    border-top:4px solid #22c55e;
}

footer p{
    color:#cccccc;
}

</style>
</head>

<body>

<header>
    <h1>Quiz om Datasikkerhet</h1>

    <nav>
        <a href="Indek.html">Hjem</a>
        <a href="forklar.html">Informasjon</a>
        <a href="eks.html">Phishing</a>
        <a href="quiz.html">Quiz</a>
    </nav>
</header>

<div class="main-container">

    <div class="quiz-box">

        <h2>Test kunnskapen din</h2>

        <form id="quizForm">

            <div class="question">
                <p>1. Hva er et sterkt passord?</p>

                <label>
                    <input type="radio" name="q1" value="0">
                    123456
                </label>

                <label>
                    <input type="radio" name="q1" value="1">
                    Et passord med bokstaver, tall og symboler
                </label>

                <label>
                    <input type="radio" name="q1" value="0">
                    password
                </label>
            </div>

            <div class="question">
                <p>2. Hva betyr phishing?</p>

                <label>
                    <input type="radio" name="q2" value="1">
                    Falske meldinger som prøver å stjele informasjon
                </label>

                <label>
                    <input type="radio" name="q2" value="0">
                    Et antivirusprogram
                </label>

                <label>
                    <input type="radio" name="q2" value="0">
                    Et sikkert passord
                </label>
            </div>

            <div class="question">
                <p>3. Hva bør du gjøre med mistenkelige lenker?</p>

                <label>
                    <input type="radio" name="q3" value="1">
                    Ikke klikke på dem
                </label>

                <label>
                    <input type="radio" name="q3" value="0">
                    Dele dem med venner
                </label>

                <label>
                    <input type="radio" name="q3" value="0">
                    Skrive inn passordet ditt
                </label>
            </div>

            <button type="button" onclick="checkQuiz()">
                Sjekk svar
            </button>

        </form>

        <div id="result"></div>

    </div>

</div>

<footer>
    <p>
        Iva – 1IMC – |
        Tema: Datasikkerhet Quiz
    </p>
</footer>

<script>

function checkQuiz(){

    let score = 0;

    let answers = document.querySelectorAll('input[type="radio"]:checked');

    answers.forEach((answer) => {
        score += Number(answer.value);
    });

    document.getElementById("result").innerHTML =
    "Du fikk " + score + " av 3 riktige!";
}

</script>

</body>
</html>
